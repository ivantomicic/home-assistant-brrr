name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/brrr/manifest.json"))["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Tag $tag_version does not match manifest $manifest_version"
            exit 1
          fi

      - name: Run pure helper tests
        run: python -m unittest discover -s tests -v

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
